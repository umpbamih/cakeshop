<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>La Douceur — Artisan Cakes</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@200;300;400&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --cream: #faf6f0;
      --blush: #e8d5c4;
      --rose:  #c9896a;
      --deep:  #2c1f18;
      --mid:   #7a5c4a;
      --gold:  #c4a26a;
      --card-bg: #fff9f4;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--cream);
      color: var(--deep);
      font-family: 'Jost', sans-serif;
      font-weight: 300;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── Noise texture overlay ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
    }

    /* ── Header ── */
    header {
      position: relative;
      text-align: center;
      padding: 72px 24px 40px;
      z-index: 1;
    }

    .header-eyebrow {
      font-family: 'Jost', sans-serif;
      font-weight: 200;
      font-size: 0.7rem;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--rose);
      margin-bottom: 16px;
      opacity: 0;
      animation: fadeUp 0.8s ease forwards 0.2s;
    }

    .header-title {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: clamp(3.2rem, 8vw, 6.5rem);
      line-height: 0.95;
      letter-spacing: -0.01em;
      color: var(--deep);
      opacity: 0;
      animation: fadeUp 0.9s ease forwards 0.35s;
    }

    .header-title em {
      font-style: italic;
      color: var(--rose);
    }

    .header-sub {
      margin-top: 20px;
      font-size: 0.8rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--mid);
      opacity: 0;
      animation: fadeUp 0.9s ease forwards 0.5s;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 16px;
      justify-content: center;
      margin: 36px auto 0;
      width: fit-content;
      opacity: 0;
      animation: fadeUp 0.9s ease forwards 0.65s;
    }
    .divider span {
      display: block;
      width: 80px;
      height: 1px;
      background: linear-gradient(to right, transparent, var(--gold));
    }
    .divider span:last-child {
      background: linear-gradient(to left, transparent, var(--gold));
    }
    .divider-icon { color: var(--gold); font-size: 1rem; }

    /* ── Enter Product button ── */
    .header-actions {
      margin-top: 28px;
      opacity: 0;
      animation: fadeUp 0.9s ease forwards 0.8s;
    }

    .btn-enter-product {
      display: inline-block;
      font-family: 'Jost', sans-serif;
      font-weight: 300;
      font-size: 0.65rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--deep);
      border: 1px solid rgba(196,162,106,0.6);
      background: transparent;
      padding: 11px 28px;
      border-radius: 2px;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.25s, color 0.25s, border-color 0.25s;
    }
    .btn-enter-product:hover {
      background: var(--deep);
      color: var(--cream);
      border-color: var(--deep);
    }

    /* ── Grid ── */
    main {
      position: relative;
      z-index: 1;
      max-width: 1200px;
      margin: 0 auto;
      padding: 60px 32px 100px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 36px;
    }

    /* ── Loading / Error states ── */
    .state-msg {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 0;
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.2rem;
      color: var(--mid);
      opacity: 0;
      animation: fadeUp 0.7s ease forwards 0.5s;
    }
    .state-msg.error { color: var(--rose); }

    /* ── Card ── */
    .card {
      background: var(--card-bg);
      border: 1px solid rgba(196,162,106,0.25);
      border-radius: 4px;
      overflow: hidden;
      cursor: pointer;
      position: relative;
      opacity: 0;
      transform: translateY(24px);
      animation: fadeUp 0.7s ease forwards;
      transition: border-color 0.3s, box-shadow 0.3s, transform 0.4s;
    }
    .card:hover {
      border-color: rgba(196,162,106,0.6);
      box-shadow: 0 20px 60px rgba(44,31,24,0.1);
      transform: translateY(-4px) !important;
    }

    .card-img-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 4/3;
      overflow: hidden;
      background: var(--blush);
    }

    .card-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.6s ease, filter 0.4s ease;
      filter: saturate(0.9);
    }
    .card:hover .card-img-wrap img {
      transform: scale(1.05);
      filter: saturate(1.05);
    }

    .card-badge {
      position: absolute;
      top: 14px;
      right: 14px;
      background: var(--rose);
      color: #fff;
      font-size: 0.6rem;
      font-weight: 400;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 2px;
    }

    .card-body {
      padding: 22px 24px 26px;
    }

    .card-category {
      font-size: 0.6rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--rose);
      margin-bottom: 8px;
    }

    .card-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.45rem;
      font-weight: 400;
      line-height: 1.2;
      color: var(--deep);
      margin-bottom: 10px;
    }

    .card-desc {
      font-size: 0.75rem;
      line-height: 1.7;
      color: var(--mid);
      margin-bottom: 20px;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .card-price-wrap {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .card-price {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.3rem;
      font-weight: 600;
      color: var(--deep);
      letter-spacing: 0.02em;
    }

    .card-price.has-sale {
      font-size: 0.95rem;
      font-weight: 300;
      color: var(--mid);
      text-decoration: line-through;
    }

    .card-sale-price {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.3rem;
      font-weight: 600;
      color: var(--rose);
      letter-spacing: 0.02em;
    }

    .btn-order {
      font-family: 'Jost', sans-serif;
      font-weight: 300;
      font-size: 0.65rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--rose);
      border: 1px solid var(--rose);
      background: transparent;
      padding: 8px 16px;
      border-radius: 2px;
      cursor: pointer;
      transition: background 0.25s, color 0.25s;
    }
    .btn-order:hover {
      background: var(--rose);
      color: #fff;
    }

    /* ── Footer ── */
    footer {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 0 24px 60px;
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--gold);
      opacity: 0.7;
    }

    /* ── Animations ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <header>
    <p class="header-eyebrow">Handcrafted with love · Seoul</p>
    <h1 class="header-title">La <em>Douceur</em></h1>
    <p class="header-sub">Artisan Pâtisserie &amp; Celebration Cakes</p>
    <div class="divider">
      <span></span>
      <span class="divider-icon">✦</span>
      <span></span>
    </div>
    <div class="header-actions">
      <a href="add-product.html" class="btn-enter-product">+ Enter Product</a>
    </div>
  </header>

  <main>
    <div class="grid" id="grid">
      <p class="state-msg" id="loading-msg">Loading our collection…</p>
    </div>
  </main>

  <footer>
    <p>✦ &nbsp; All cakes are made to order · Please allow 48 hours &nbsp; ✦</p>
  </footer>

  <script>
    // ── Fallback data (from your sheet — always displays instantly) ──────────
    const FALLBACK = [
      { name: 'Strawberry Cake',         category: 'Cake', desc: '', price: '₩38,000', sale: '', badge: 'Classic', img: 'https://images.unsplash.com/photo-1565958011703-44f9829ba187?w=600&q=80' },
      { name: 'Chocolate Cake',          category: 'Cake', desc: '', price: '₩35,000', sale: '', badge: 'Classic', img: 'https://images.unsplash.com/photo-1464349095431-e9a21285b5f3?w=600&q=80' },
      { name: 'Uji Matcha Cake',         category: 'Cake', desc: '', price: '₩42,000', sale: '', badge: 'Limited', img: 'https://images.unsplash.com/photo-1486427944299-d1955d23e34d?w=600&q=80' },
      { name: 'Mango Cream Cheese Tart', category: 'Tart', desc: '', price: '₩35,000', sale: '', badge: 'New',     img: 'https://images.unsplash.com/photo-1519915028121-7d3463d20b13?w=600&q=80' },
      { name: 'Lemon Tart',              category: 'Tart', desc: '', price: '₩32,000', sale: '', badge: 'Classic', img: 'https://images.unsplash.com/photo-1530648672449-81f6c723e2f1?w=600&q=80' },
      { name: 'Strawberry Tart',         category: 'Tart', desc: '', price: '₩35,000', sale: '', badge: 'Classic', img: 'https://images.unsplash.com/photo-1488477181946-6428a0291777?w=600&q=80' },
    ];

    // ── Google Sheet CSV URL ─────────────────────────────────────────────────
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQM4fk3RhrWyldQNR_dZWyRH8HGH27D_3jhPqY4AhWwe18dV69VdyAozIjEYOdCs0P4x078yQDS54D0/pub?output=csv';

    // ── CSV parser ───────────────────────────────────────────────────────────
    function parseCSV(text) {
      const lines = text.trim().split(/\r?\n/);
      if (lines.length < 2) return [];
      const headers = splitRow(lines[0]).map(h => h.trim().toLowerCase());
      return lines.slice(1).map(line => {
        const vals = splitRow(line);
        const obj = {};
        headers.forEach((h, i) => {
          const v = (vals[i] || '').trim();
          obj[h] = (v.toLowerCase() === 'null') ? '' : v;
        });
        return obj;
      }).filter(r => r.name);
    }

    function splitRow(row) {
      const result = []; let cur = '', inQ = false;
      for (let i = 0; i < row.length; i++) {
        const c = row[i];
        if (c === '"') { if (inQ && row[i+1] === '"') { cur += '"'; i++; } else inQ = !inQ; }
        else if (c === ',' && !inQ) { result.push(cur); cur = ''; }
        else cur += c;
      }
      result.push(cur);
      return result;
    }

    // ── Live fetch with multiple proxy fallbacks ──────────────────────────────
    const PROXIES = [
      `https://api.allorigins.win/raw?url=${encodeURIComponent(CSV_URL)}`,
      `https://corsproxy.io/?${encodeURIComponent(CSV_URL)}`,
      `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(CSV_URL)}`,
    ];

    async function tryFetch(url) {
      const ctrl = new AbortController();
      const tid = setTimeout(() => ctrl.abort(), 5000);
      try {
        const res = await fetch(url, { signal: ctrl.signal });
        clearTimeout(tid);
        if (!res.ok) return null;
        const text = await res.text();
        const t = text.trim();
        if (t.startsWith('<') || t.startsWith('{') || t.length < 10) return null;
        return text;
      } catch { return null; }
    }

    async function fetchLive() {
      for (const proxy of PROXIES) {
        const text = await tryFetch(proxy);
        if (text) {
          const rows = parseCSV(text);
          if (rows.length) return rows;
        }
      }
      return null;
    }

    // ── Card builder ─────────────────────────────────────────────────────────
    function createCard(p, i) {
      const card = document.createElement('div');
      card.className = 'card';
      card.style.animationDelay = `${0.5 + i * 0.15}s`;

      const badgeHTML = p.badge ? `<span class="card-badge">${esc(p.badge)}</span>` : '';
      const imgSrc    = p.img || p.image || '';
      const imgHTML   = imgSrc ? `<img src="${esc(imgSrc)}" alt="${esc(p.name)}" loading="lazy"/>` : '';
      const hasSale   = p.sale && p.sale.trim() !== '';
      const priceHTML = hasSale
        ? `<div class="card-price-wrap">
             <span class="card-price has-sale">${esc(p.price || '')}</span>
             <span class="card-sale-price">${esc(p.sale)}</span>
           </div>`
        : `<span class="card-price">${esc(p.price || '')}</span>`;

      card.innerHTML = `
        <div class="card-img-wrap">${imgHTML}${badgeHTML}</div>
        <div class="card-body">
          <p class="card-category">${esc(p.category || '')}</p>
          <h2 class="card-name">${esc(p.name)}</h2>
          <p class="card-desc">${esc(p.desc || '')}</p>
          <div class="card-footer">${priceHTML}<button class="btn-order">Order</button></div>
        </div>`;
      return card;
    }

    function esc(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function render(products) {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      products.forEach((p, i) => grid.appendChild(createCard(p, i)));
    }

    // ── Boot ─────────────────────────────────────────────────────────────────
    (async () => {
      render(FALLBACK);
      const live = await fetchLive();
      if (live) render(live);
    })();
  </script>

</body>
</html>
